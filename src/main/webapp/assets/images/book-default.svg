<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Bìa sách mặc định cổ điển">
  <defs>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2212"/>
      <stop offset="50%" stop-color="#36170a"/>
      <stop offset="100%" stop-color="#1f0c05"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc7"/>
      <stop offset="40%" stop-color="#dfb76c"/>
      <stop offset="70%" stop-color="#c5923b"/>
      <stop offset="100%" stop-color="#8a5e18"/>
    </linearGradient>
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="20%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Leather Book Body -->
  <rect width="400" height="520" rx="6" fill="url(#leatherGrad)"/>

  <!-- Spine Shadow overlay on left edge -->
  <rect x="0" y="0" width="35" height="520" fill="url(#spineShadow)"/>

  <!-- Double Gold Embossed Borders -->
  <rect x="28" y="24" width="344" height="472" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>
  <rect x="36" y="32" width="328" height="456" rx="2" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,3" opacity="0.6"/>

  <!-- Ornaments in Corners -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8">
    <path d="M 45 65 Q 45 45 65 45" />
    <path d="M 355 65 Q 355 45 335 45" />
    <path d="M 45 455 Q 45 475 65 475" />
    <path d="M 355 455 Q 355 475 335 475" />
  </g>

  <!-- Central Crest Ornament -->
  <circle cx="200" cy="210" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.9"/>
  <circle cx="200" cy="210" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4,2" opacity="0.7"/>

  <!-- Open Book Icon inside Crest -->
  <g fill="url(#goldGrad)">
    <path d="M 172 205 Q 186 195 200 198 Q 214 195 228 205 L 228 225 Q 214 215 200 218 Q 186 215 172 225 Z" opacity="0.95"/>
    <line x1="200" y1="198" x2="200" y2="225" stroke="#36170a" stroke-width="1.5"/>
    <path d="M 180 234 L 200 244 L 220 234" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <text x="200" y="310" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, 'Playfair Display', serif" font-size="21" font-weight="bold" letter-spacing="4">BOOKSTORE</text>
  <text x="200" y="335" text-anchor="middle" fill="#d4aa78" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" letter-spacing="2" opacity="0.85">ẤN BẢN ĐẶC BIỆT</text>

  <!-- Bottom Details -->
  <line x1="130" y1="365" x2="270" y2="365" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
  <circle cx="200" cy="365" r="3" fill="url(#goldGrad)"/>
</svg>
